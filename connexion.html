<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',Arial,sans-serif;

body{

display:flex;

padding:20px;

linear-gradient(135deg,#003b1f,#006837,#009245);

}

z-index:2;

animation:apparition .8s ease;

}

opacity:0;

transform:translateY(40px);

}

to{

}

}

.banner{

width:100%;

border-radius:25px;

box-shadow:

0 15px 40px rgba(0,0,0,.35);

margin-bottom:20px;

}

.card{

background:white;

border-radius:30px;

padding:35px;

box-shadow:

0 20px 50px rgba(0,0,0,.30);

text-align:center;

}

.logo{

width:100px;

height:100px;

object-fit:contain;

background:white;

padding:10px;

border-radius:20px;

border:3px solid #009245;

box-shadow:

0 10px 25px rgba(0,0,0,.20);

margin-bottom:15px;

}

h1{

color:#009245;

font-size:28px;

margin-bottom:10px;

}

.slogan{

color:#666;

font-size:15px;

margin-bottom:30px;

line-height:1.5;

}

.input-box{

position:relative;

margin-bottom:18px;

}

.input-box i{

position:absolute;

left:18px;

top:50%;

transform:translateY(-50%);

color:#009245;

font-size:18px;

}

.input-box input{

padding:15px 15px 15px 52px;

border:2px solid #ddd;

}

.input-box input:focus{

border-color:#009245;

box-shadow:

0 0 10px rgba(0,146,69,.25);

}

.password-toggle{

position:absolute;

right:18px;

top:50%;

transform:translateY(-50%);

cursor:pointer;

color:#777;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:15px;

background:

linear-gradient(135deg,#009245,#006837);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

margin-top:10px;

}

button:hover{

box-shadow:

0 10px 20px rgba(0,0,0,.20);

}

.btn-member{

.btn-member:hover{

}

<body>

<div class="container">

<img src="banniere.png" class="banner">

<div class="card">

<img src="logo.png" class="logo">

<h1>Connexion Membre</h1>

<p class="slogan">

Bienvenue dans la plateforme officielle de la<br>

<b>COMMUNAUTÉ NUMÉRIQUE MWANA MBOKA</b>

</p>


<!-- ==========================
FORMULAIRE DE CONNEXION
========================== -->

<div class="input-box">

    <i class="fa-solid fa-id-card"></i>

    <input
        type="text"
        id="matricule"
        placeholder="Votre matricule">

</div>

<div class="input-box">

    <i class="fa-solid fa-lock"></i>

    <input
        type="password"
        id="motdepasse"
        placeholder="Votre mot de passe">

    <i
        class="fa-solid fa-eye password-toggle"
        id="togglePassword">
    </i>

</div>

<button onclick="connexion()">

    <i class="fa-solid fa-right-to-bracket"></i>

    Se connecter

</button>

<a href="adhesion.html" class="btn-member">

    <i class="fa-solid fa-user-plus"></i>

    Devenir membre

</a>

<div id="message"></div>

<div class="footer">

    <strong>COMMUNAUTÉ NUMÉRIQUE MWANA MBOKA</strong>

    <br>

    Ensemble nous irons plus loin.

    <br><br>

    © <span id="annee"></span> Tous droits réservés.

</div>

</div>

</div>

<script>

document.getElementById("annee").textContent =
new Date().getFullYear();

const toggle =
document.getElementById("togglePassword");

const password =
document.getElementById("motdepasse");

toggle.onclick = () => {

    if(password.type==="password"){

        password.type="text";

        toggle.classList.remove("fa-eye");

        toggle.classList.add("fa-eye-slash");

    }else{

        password.type="password";

        toggle.classList.remove("fa-eye-slash");

        toggle.classList.add("fa-eye");

    }

};

</script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getDatabase,
ref,
get,
set,
push
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyDHMovN3CpVl6fQUDZGRNqFu6mLUUPR8Sc",

authDomain:"c-n-mwana-mboka.firebaseapp.com",

databaseURL:"https://c-n-mwana-mboka-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"c-n-mwana-mboka",

storageBucket:"c-n-mwana-mboka.firebasestorage.app",

messagingSenderId:"757726608581",

appId:"1:757726608581:web:27fa7003ffa955188304ac"

};

const app=initializeApp(firebaseConfig);

const database=getDatabase(app);

window.connexion=async()=>{

const matricule=document.getElementById("matricule").value.trim();

const motdepasse=document.getElementById("motdepasse").value.trim();

const message=document.getElementById("message");

message.style.color="red";
message.innerHTML="";

if(matricule==="" || motdepasse===""){

message.innerHTML="Veuillez remplir tous les champs.";

return;

}

try{

const membreRef=ref(database,"membres/"+matricule);

const snapshot=await get(membreRef);

if(!snapshot.exists()){

message.innerHTML="Matricule introuvable.";

return;

}

const membre=snapshot.val();

if(String(membre.motdepasse)!==motdepasse){

message.innerHTML="Mot de passe incorrect.";

return;

}

localStorage.clear();

localStorage.setItem("matricule",matricule);
localStorage.setItem("nom",membre.nom || "");
localStorage.setItem("telephone",membre.telephone || "");
localStorage.setItem("photo",membre.photo || "");
localStorage.setItem("statut",membre.statut || "Actif");
localStorage.setItem("dateAdhesion",membre.dateAdhesion || "");
localStorage.setItem("parrain",membre.parrain || "");
localStorage.setItem(
"role",
(membre.role || "membre").toLowerCase()
);


let bureau="espace.html";

let fonction="membre";

const organigrammeRef=ref(database,"organigramme");

const organigrammeSnap=await get(organigrammeRef);

if(organigrammeSnap.exists()){

chercherFonction(organigrammeSnap.val());

}

function chercherFonction(obj){

for(const cle in obj){

const valeur=obj[cle];

if(typeof valeur==="object" && valeur!==null){

if(
String(valeur.responsableMatricule).trim().toUpperCase() ===
matricule.toUpperCase()
){

fonction=valeur.fonction || cle;

localStorage.setItem("fonction",fonction);

switch(fonction){

case "president":

bureau="prbureau.html";

break;

case "secretariat_administration":

bureau="bureau-secretariat.html";

break;

case "formation":

bureau="bureau-formation.html";

break;

case "communication":

bureau="bureau-communication.html";

break;

case "projets":

bureau="bureau-projets.html";

break;

case "conseiller_administratif":

case "conseiller_juridique":

case "conseiller_financier":

case "conseiller_technique":

bureau="bureau-conseil.html";

break;

case "tresorerie":

case "comptabilite":

case "economie":

case "etudes_investissements":

bureau="bureau-finance.html";

break;

}

}

chercherFonction(valeur);

}

}

}

const estPresident=

(membre.role || "").toLowerCase()==="president" ||

membre.fondateur===true;

if(estPresident){

fonction="president";

bureau="prbureau.html";

localStorage.setItem("fonction","president");

localStorage.setItem("role","president");

}

//======================================
// SI AUCUNE FONCTION N'A ETE TROUVEE
//======================================

if(fonction==="membre"){
fonction="membre";

bureau="espace.html";

localStorage.setItem("fonction","membre");

}


//======================================
// ENREGISTREMENT DANS LE JOURNAL
//======================================

const journalRef=
push(ref(database,"journal_activites"));

await set(journalRef,{

date:new Date().toLocaleDateString("fr-FR"),

heure:new Date().toLocaleTimeString("fr-FR"),

matricule:matricule,

nom:membre.nom || "",

fonction:fonction,

bureau:bureau,

action:"Connexion"

});


//======================================
// SESSION COMPLETE
//======================================

localStorage.setItem("bureau",bureau);

localStorage.setItem(

"utilisateurConnecte",

JSON.stringify({

matricule:matricule,

nom:membre.nom || "",

fonction:fonction,

bureau:bureau

})

);


//======================================
// MESSAGE
//======================================

message.style.color="green";

message.innerHTML=

'<i class="fa-solid fa-circle-check"></i> Connexion réussie...';


//======================================
// REDIRECTION
//======================================

setTimeout(()=>{

window.location.href=bureau;

},1000);

}

catch(erreur){

console.error(erreur);

message.style.color="red";

message.innerHTML=

"Impossible de se connecter à Firebase.";

}

};

</script>

</body>

</html>
