<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion - MWANA MBOKA</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f5f7;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:450px;
}

.banner{
width:100%;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
margin-bottom:20px;
}

.card{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
text-align:center;
}

.logo{
width:90px;
background:white;
padding:8px;
border-radius:15px;
margin-bottom:15px;
}

h1{
color:#009245;
margin:10px 0;
}

p{
color:#666;
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#009245;
color:white;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#007537;
}

.btn-member{
display:block;
margin-top:15px;
padding:14px;
background:#f1c40f;
color:#000;
text-decoration:none;
border-radius:12px;
font-weight:bold;
}

.footer{
margin-top:20px;
font-size:14px;
color:#777;
}

</style>
</head>

<body>

<div class="container">

<img src="banniere.png" class="banner">

<div class="card">

<img src="logo.png" class="logo">

<h1>Connexion Membre</h1>

<p>
Bienvenue dans l'espace membre de MWANA MBOKA.
</p>

<input type="text" placeholder="Matricule">

<input type="password" placeholder="Mot de passe">

<button onclick="connexion()">
Se connecter
</button>

<a href="adhesion.html" class="btn-member">
Devenir membre
</a>

<div class="footer">
Ensemble nous irons plus loin.
</div>

</div>

</div>

<script>

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getDatabase,
ref,
get,
set,
push
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig={

apiKey:"AIzaSyDHMovN3CpVl6fQUDZGRNqFu6mLUUPR8Sc",

authDomain:"c-n-mwana-mboka.firebaseapp.com",

databaseURL:"https://c-n-mwana-mboka-default-rtdb.europe-west1.firebasedatabase.app",

projectId:"c-n-mwana-mboka",

storageBucket:"c-n-mwana-mboka.firebasestorage.app",

messagingSenderId:"757726608581",

appId:"1:757726608581:web:27fa7003ffa955188304ac"

};

const app=initializeApp(firebaseConfig);

const database=getDatabase(app);

window.connexion=async()=>{

const matricule=
document.getElementById("matricule").value.trim();

const motdepasse=
document.getElementById("motdepasse").value.trim();

const message=
document.getElementById("message");

message.innerHTML="";

if(matricule==="" || motdepasse===""){

message.style.color="red";

message.innerHTML="Veuillez remplir tous les champs.";

return;

}

try{

const membreRef=
ref(database,"membres/"+matricule);

const snapshot=
await get(membreRef);

if(!snapshot.exists()){

message.style.color="red";

message.innerHTML="Matricule introuvable.";

return;

}

const membre=snapshot.val();

if(String(membre.motdepasse)!==motdepasse){

message.style.color="red";

message.innerHTML="Mot de passe incorrect.";

return;

    }

//======================================
// CREATION DE LA SESSION
//======================================

localStorage.clear();

localStorage.setItem("matricule",matricule);

localStorage.setItem("nom",membre.nom || "");

localStorage.setItem("telephone",membre.telephone || "");

localStorage.setItem("photo",membre.photo || "");

localStorage.setItem("statut",membre.statut || "Actif");

localStorage.setItem("dateAdhesion",membre.dateAdhesion || "");

localStorage.setItem("parrain",membre.parrain || "");

message.style.color="green";
message.innerHTML="Connexion réussie...";


//======================================
// LECTURE DU GS ORGANIGRAMME
//======================================

const organigrammeRef =
ref(database,"organigramme");

const organigrammeSnap =
await get(organigrammeRef);

let bureau="espace.html";

let fonction="membre";

if(organigrammeSnap.exists()){

const organigramme=
organigrammeSnap.val();

chercherFonction(organigramme);

}

function chercherFonction(obj){

for(const cle in obj){

const valeur=obj[cle];

if(typeof valeur==="object" && valeur!==null){

if(valeur.responsableMatricule===matricule){

fonction=
valeur.fonction || cle;

localStorage.setItem(
"fonction",
fonction
);

switch(fonction){

case "president":

bureau="prbureau.html";
break;

case "secretariat_administration":

bureau="bureau-secretariat.html";
break;

case "formation":

bureau="bureau-formation.html";
break;

case "communication":

bureau="bureau-communication.html";
break;

case "projets":

bureau="bureau-projets.html";
break;

case "conseiller_administratif":

case "conseiller_juridique":

case "conseiller_financier":

case "conseiller_technique":

bureau="bureau-conseil.html";
break;

case "tresorerie":

case "comptabilite":

case "economie":

case "etudes_investissements":

bureau="bureau-finance.html";
break;

}

}

chercherFonction(valeur);

}

}

    }


//======================================
// SECURITE PRESIDENT FONDATEUR
//======================================

// Si le membre est identifié comme Président
// mais qu'aucune nomination n'existe encore
// dans le GS Organigramme.

const estPresident =

(membre.role || "").toLowerCase() === "president" ||

(membre.fondateur === true);

if(estPresident){

fonction = "president";

bureau = "prbureau.html";

localStorage.setItem("fonction","president");

localStorage.setItem("role","president");

}

// Si aucune fonction n'a été trouvée,
// le membre reste simple membre.

if(!fonction){

fonction = "membre";

bureau = "espace.html";

localStorage.setItem("fonction","membre");

    }

    
//======================================
// ENREGISTREMENT DANS LE JOURNAL
//======================================

const journalRef =
push(ref(database,"journal_activites"));

await set(journalRef,{

date:new Date().toLocaleDateString("fr-FR"),

heure:new Date().toLocaleTimeString("fr-FR"),

matricule:matricule,

nom:membre.nom || "",

fonction:fonction,

action:"Connexion au système",

bureau:bureau

});


//======================================
// ENREGISTREMENT SESSION COMPLETE
//======================================

localStorage.setItem("bureau",bureau);

localStorage.setItem(
"utilisateurConnecte",
JSON.stringify({

matricule:matricule,

nom:membre.nom || "",

fonction:fonction,

bureau:bureau

})

);


//======================================
// REDIRECTION AUTOMATIQUE
//======================================

setTimeout(()=>{

window.location.href=bureau;

},1000);

}

catch(erreur){

console.error(erreur);

message.style.color="red";

message.innerHTML=
"Erreur de connexion avec Firebase.";

}

};



</script>

</body>

    </html>
