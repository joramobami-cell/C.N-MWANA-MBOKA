<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion | MWANA MBOKA</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}


body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(
135deg,
#003b1f,
#009245,
#00b050
);

}



/* CARTE CONNEXION */


.login-card{

width:95%;

max-width:430px;

background:#fff;

border-radius:20px;

padding:35px;

box-shadow:
0 15px 45px rgba(0,0,0,.30);

}



/* LOGO */


.logo{

text-align:center;

margin-bottom:25px;

}


.logo img{

width:110px;

height:110px;

object-fit:contain;

}


.logo h1{

color:#009245;

font-size:28px;

margin-top:10px;

}


.logo p{

font-size:14px;

color:#555;

font-weight:bold;

}




/* TITRE */


.title{

text-align:center;

margin-bottom:30px;

}


.title h2{

color:#003b1f;

font-size:23px;

}


.title span{

color:#009245;

}





/* FORMULAIRE */


.group{

margin-bottom:20px;

}



.group label{

display:block;

font-weight:bold;

color:#003b1f;

margin-bottom:8px;

}




.input{

position:relative;

}



.input i{

position:absolute;

left:15px;

top:50%;

transform:translateY(-50%);

color:#009245;

}



.input input{

width:100%;

padding:14px 15px 14px 45px;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

outline:none;

}



.input input:focus{

border-color:#009245;

}





button{

width:100%;

padding:15px;

border:none;

border-radius:10px;

background:#009245;

color:white;

font-size:16px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#006b32;

}




#message{

margin-top:18px;

text-align:center;

font-weight:bold;

font-size:14px;

}





.footer{

margin-top:25px;

text-align:center;

font-size:13px;

color:#777;

}



.footer strong{

color:#009245;

}




.loader{

display:none;

text-align:center;

margin-top:15px;

}



.loader i{

font-size:25px;

color:#009245;

}





</style>

</head>


<body>



<div class="login-card">



<div class="logo">


<img src="images/logo.png"
alt="Logo MWANA MBOKA">


<h1>
MWANA MBOKA
</h1>


<p>
Ensemble nous irons plus loin
</p>


</div>





<div class="title">

<h2>
Connexion <span>Membre</span>
</h2>

</div>







<form id="connexionForm">



<div class="group">


<label>
Matricule membre
</label>


<div class="input">

<i class="fa-solid fa-id-card"></i>


<input

type="text"

id="matricule"

placeholder="Ex : MM20260001"

autocomplete="off"

required>

</div>


</div>







<div class="group">


<label>
Mot de passe
</label>


<div class="input">


<i class="fa-solid fa-lock"></i>


<input

type="password"

id="password"

placeholder="Votre mot de passe"

required>


</div>


</div>








<button type="submit">

<i class="fa-solid fa-right-to-bracket"></i>

Connexion

</button>





<div class="loader" id="loader">

<i class="fa-solid fa-spinner fa-spin"></i>

</div>





<div id="message"></div>




</form>







<div class="footer">


COMMUNAUTÉ NUMÉRIQUE

<strong>
MWANA MBOKA
</strong>


<br>

Système officiel de gestion


</div>



</div>






<!--
=================================
SYSTEME MWANA MBOKA
CONNEXION OFFICIELLE
=================================

Les éléments suivants seront ajoutés :

PARTIE 2 :
- Firebase
- Firestore
- Recherche matricule
- Validation mot de passe
- Chargement profil membre


PARTIE 3 :
- GS Organigramme
- Permissions
- Journal activité
- Redirections bureaux

-->



<script type="module">



/*

BASE DU SYSTEME

Le moteur complet arrive
dans les parties suivantes.

*/


const formulaire =
document.getElementById("connexionForm");


const message =
document.getElementById("message");


const loader =
document.getElementById("loader");




formulaire.addEventListener(
"submit",
(e)=>{


e.preventDefault();


let matricule =
document.getElementById("matricule").value.trim();



let password =
document.getElementById("password").value.trim();




if(!matricule || !password){

message.style.color="red";

message.innerHTML=
"Veuillez remplir tous les champs";

return;

}



loader.style.display="block";


message.style.color="#009245";

message.innerHTML=
"Connexion au système MWANA MBOKA...";



/*

Connexion Firebase
dans la partie 2

*/


});



</script>



</body>

    </html>
