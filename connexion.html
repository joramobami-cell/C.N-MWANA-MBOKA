<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#006b3f"
    >

    <title>
        Connexion | COMMUNAUTÉ NUMÉRIQUE MWANA MBOKA
    </title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS de la page -->
    <link
        rel="stylesheet"
        href="connexion.css"
    >

</head>

<body>

    <main class="connexion-page">

        <!-- Bannière -->
        <img
            src="banniere.png"
            class="banner"
            alt="Bannière COMMUNAUTÉ NUMÉRIQUE MWANA MBOKA"
        >

        <section class="connexion-card">

            <!-- Logo -->
            <div class="logo-container">

                <img
                    src="logo.png"
                    class="logo"
                    alt="Logo MWANA MBOKA"
                >

            </div>

            <!-- Titre -->
            <h1>
                Connexion Membre
            </h1>

            <p class="slogan">
                Bienvenue sur la plateforme officielle de la
                <strong>
                    COMMUNAUTÉ NUMÉRIQUE MWANA MBOKA
                </strong>
            </p>

            <!-- Formulaire -->
            <form
                id="connexionForm"
                autocomplete="on"
            >

                <!-- Matricule -->
                <div class="input-box">

                    <i
                        class="fa-solid fa-id-card input-icon"
                    ></i>

                    <input
                        type="text"
                        id="matricule"
                        name="matricule"
                        placeholder="Votre matricule"
                        autocomplete="username"
                        required
                    >

                </div>

                <!-- Mot de passe -->
                <div class="input-box">

                    <i
                        class="fa-solid fa-lock input-icon"
                    ></i>

                    <input
                        type="password"
                        id="motdepasse"
                        name="motdepasse"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Afficher le mot de passe"
                    >

                        <i
                            class="fa-solid fa-eye"
                        ></i>

                    </button>

                </div>

                                 <!-- Bouton de connexion -->
                <button
                    type="submit"
                    id="boutonConnexion"
                    class="btn-connexion"
                >

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Se connecter

                </button>

            </form>


            <!-- Inscription -->
            <a
                href="adhesion.html"
                class="btn-member"
            >

                <i class="fa-solid fa-user-plus"></i>

                Devenir membre

            </a>


            <!-- Message système -->
            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- Informations de sécurité -->
            <div class="security-info">

                <i class="fa-solid fa-shield-halved"></i>

                <span>
                    Votre session sera automatiquement fermée
                    après 10 minutes d'inactivité.
                </span>

                 </div>

                         <!-- Pied de page -->
            <div class="footer">

                <strong>
                    COMMUNAUTÉ NUMÉRIQUE MWANA MBOKA
                </strong>

                <br>

                Ensemble nous irons plus loin.

                <br><br>

                ©
                <span id="annee"></span>
                Tous droits réservés.

            </div>

        </section>

    </main>

         <!-- JavaScript de connexion -->
    <script
        type="module"
        src="connexion.js"
    ></script>

</body>

</html>
